name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.22', '1.23']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: false
          cache: true

      - name: Download dependencies
        run: go mod download
        env:
          GOTOOLCHAIN: local

      - name: Verify dependencies
        run: go mod verify
        env:
          GOTOOLCHAIN: local

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.1.0
          args: --timeout=5m
        env:
          GOTOOLCHAIN: local

      - name: Build
        run: go build -v ./...
        env:
          GOTOOLCHAIN: local

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...
        env:
          GOTOOLCHAIN: local

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-go${{ matrix.go-version }}
          path: coverage.out